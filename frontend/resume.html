<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting to Run View...</title>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    if (id) {
      window.location.replace("index.html#/run/" + encodeURIComponent(id));
    } else {
      window.location.replace("index.html#/create");
    }
  </script>
</head>
<body>
  <p>Redirecting to <a href="index.html#/create">ResumeForge</a>...</p>
</body>
</html>
